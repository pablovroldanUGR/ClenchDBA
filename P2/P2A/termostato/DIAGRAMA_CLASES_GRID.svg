<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de clases: módulo GRID</title>
  <desc id="desc">Diagrama 16:9 de las clases del módulo GRID, la GUI, el entorno, la API, los tipos compartidos y las dependencias externas de JADE y Swing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1220"/><stop offset="1" stop-color="#111d30"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9bb4d1" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#b6c6dc" stroke-width="1.7"/>
    </marker>
    <marker id="inherit" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#111d30" stroke="#70a7ff" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".34"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { fill:#f1f6ff; font-size:42px; font-weight:750; letter-spacing:.2px }
      .subtitle { fill:#aabbd2; font-size:20px; font-weight:400 }
      .lane { fill:#91a6c1; font-size:15px; font-weight:700; letter-spacing:2px }
      .card { fill:#111e31; stroke:#30445e; stroke-width:1.5; rx:16; filter:url(#shadow) }
      .card-blue { stroke:#4c85d9 }
      .card-teal { stroke:#39a997 }
      .card-violet { stroke:#9a81e5 }
      .card-amber { stroke:#c89240 }
      .card-muted { stroke:#65758c; stroke-dasharray:7 5 }
      .header { fill:#edf4ff; font-size:23px; font-weight:700 }
      .stereo { fill:#97aac3; font-size:14px; font-weight:600; letter-spacing:.5px }
      .field { fill:#c6d2e2; font-size:17px }
      .method { fill:#8fd9ca; font-size:17px }
      .small { fill:#98abc3; font-size:15px }
      .divider { stroke:#30445e; stroke-width:1 }
      .edge { fill:none; stroke:#b6c6dc; stroke-width:2.2; marker-end:url(#arrow) }
      .edge-dash { fill:none; stroke:#9aacc4; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow) }
      .generalization { fill:none; stroke:#70a7ff; stroke-width:2.2; marker-end:url(#inherit) }
      .edge-label { fill:#cfdaea; font-size:15px; font-weight:550; paint-order:stroke; stroke:#0d1726; stroke-width:6px; stroke-linejoin:round }
      .pill { fill:#1b2d44; stroke:#3a506c; stroke-width:1 }
      .pilltext { fill:#bed0e6; font-size:14px; font-weight:650 }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect x="70" y="55" width="7" height="66" rx="3.5" fill="#4c98ff"/>
  <text class="title" x="100" y="88">Diagrama de clases · GRID</text>
  <text class="subtitle" x="101" y="123">Interfaz, agente JADE, estrategia de movimiento y conexión con DBA Lab</text>
  <g transform="translate(1530 65)">
    <rect class="pill" width="315" height="42" rx="21"/>
    <circle cx="22" cy="21" r="5" fill="#70a7ff"/><text class="pilltext" x="39" y="26">PROYECTO JAVA · P2A · VISTA 16:9</text>
  </g>
  <line x1="75" y1="145" x2="1845" y2="145" stroke="#2a3d56" stroke-width="1.5"/>

  <text class="lane" x="90" y="177">CONTROL Y VISTA</text>
  <text class="lane" x="550" y="177">AGENTE JADE</text>
  <text class="lane" x="1015" y="177">ENTORNO GRID</text>
  <text class="lane" x="1490" y="177">TIPOS COMPARTIDOS</text>

  <!-- Relations are drawn first so the class cards stay crisp on top. -->
  <path class="edge" d="M 250 375 V 460"/>
  <text class="edge-label" x="266" y="422">crea / actualiza</text>
  <path class="edge-dash" d="M 410 505 H 450 V 330 H 410"/>
  <text class="edge-label" x="420" y="485">eventos de la GUI</text>

  <path class="edge-dash" d="M 410 275 H 550"/>
  <text class="edge-label" x="444" y="260">inicia el agente</text>
  <path class="edge" d="M 915 280 H 1015"/>
  <text class="edge-label" x="920" y="262">registra</text>
  <path class="edge" d="M 850 410 H 950 V 550 H 915"/>
  <text class="edge-label" x="956" y="510">obtiene entorno</text>
  <path class="edge" d="M 1400 425 H 1450 V 580 H 1400"/>
  <text class="edge-label" x="1410" y="520">consulta y actúa</text>

  <path class="generalization" d="M 1015 610 H 915"/>
  <text class="edge-label" x="925" y="594">hereda</text>
  <path class="edge" d="M 740 780 V 820"/>
  <text class="edge-label" x="756" y="809">usa API</text>
  <path class="edge-dash" d="M 1400 740 H 1450 V 870 H 1490"/>
  <text class="edge-label" x="1408" y="820">usa tipos</text>
  <path class="edge" d="M 900 900 H 1015"/>
  <text class="edge-label" x="920" y="884">devuelve</text>
  <path class="edge-dash" d="M 1365 955 H 1490"/>
  <text class="edge-label" x="1370" y="940">RunStatus · Pair</text>

  <!-- GUI and application entry point -->
  <g>
    <rect class="card card-blue" x="90" y="195" width="320" height="180"/>
    <text class="stereo" x="116" y="224">ENTORNO · PUNTO DE ENTRADA</text>
    <text class="header" x="116" y="255">Main</text>
    <line class="divider" x1="116" y1="270" x2="384" y2="270"/>
    <text class="field" x="116" y="296">environment: Environment</text>
    <text class="field" x="116" y="320">gui: GUI</text>
    <line class="divider" x1="116" y1="335" x2="384" y2="335"/>
    <text class="method" x="116" y="360">startChallenge · closeRun · updateMap</text>
  </g>
  <g>
    <rect class="card card-violet" x="90" y="460" width="320" height="225"/>
    <text class="stereo" x="116" y="490">UI · SWING</text>
    <text class="header" x="116" y="522">GUI</text>
    <text class="small" x="205" y="522">hereda de JFrame</text>
    <line class="divider" x1="116" y1="538" x2="384" y2="538"/>
    <text class="field" x="116" y="565">mapCells: JPanel[][]</text>
    <text class="field" x="116" y="590">selectores · botones · textos</text>
    <line class="divider" x1="116" y1="606" x2="384" y2="606"/>
    <text class="method" x="116" y="633">printText · updateMap · updateInfo</text>
    <text class="small" x="116" y="660">Muestra estado, mapa y mensajes</text>
  </g>
  <g>
    <rect class="card card-muted" x="90" y="790" width="320" height="150"/>
    <text class="stereo" x="116" y="820">ARRANQUE Y CONTROL</text>
    <text class="header" x="116" y="852">Flujo de la aplicación</text>
    <text class="field" x="116" y="881">GUI → Main → AgentGrid</text>
    <text class="small" x="116" y="911">Main inicia el agente dentro de JADE</text>
  </g>

  <!-- Grid agent and behaviour -->
  <g>
    <rect class="card card-blue" x="550" y="195" width="365" height="215"/>
    <text class="stereo" x="576" y="224">GRID · AGENTE JADE</text>
    <text class="header" x="576" y="256">AgentGrid</text>
    <line class="divider" x1="576" y1="272" x2="889" y2="272"/>
    <text class="field" x="576" y="299">grid: EnvironmentGrid</text>
    <text class="field" x="576" y="323">position: Pair · energy: int</text>
    <text class="field" x="576" y="347">direction: Direction</text>
    <line class="divider" x1="576" y1="363" x2="889" y2="363"/>
    <text class="method" x="576" y="390">setup · getEnvironment · takeDown</text>
  </g>
  <g>
    <rect class="card card-muted" x="550" y="435" width="365" height="62"/>
    <text class="stereo" x="576" y="460">HERENCIA EXTERNA</text>
    <text class="header" x="576" y="485">jade.core.Agent</text>
  </g>
  <path class="generalization" d="M 732 410 V 435"/>

  <g>
    <rect class="card card-teal" x="1015" y="195" width="385" height="255"/>
    <text class="stereo" x="1041" y="224">GRID · COMPORTAMIENTO JADE</text>
    <text class="header" x="1041" y="256">BHGrid</text>
    <line class="divider" x1="1041" y1="272" x2="1374" y2="272"/>
    <text class="field" x="1041" y="299">grid: EnvironmentGrid</text>
    <text class="field" x="1041" y="323">bumpers · casillas adyacentes</text>
    <text class="field" x="1041" y="347">dirección · última acción</text>
    <text class="field" x="1041" y="371">seguimiento de pared / greedy</text>
    <line class="divider" x1="1041" y1="387" x2="1374" y2="387"/>
    <text class="method" x="1041" y="416">action · done · onEnd</text>
  </g>
  <g>
    <rect class="card card-muted" x="1015" y="485" width="385" height="62"/>
    <text class="stereo" x="1041" y="510">HERENCIA EXTERNA</text>
    <text class="header" x="1041" y="535">jade.core.behaviours.Behaviour</text>
  </g>
  <path class="generalization" d="M 1208 450 V 485"/>

  <!-- Environment hierarchy -->
  <g>
    <rect class="card card-blue" x="550" y="530" width="365" height="250"/>
    <text class="stereo" x="576" y="560">ENTORNO · ABSTRACTA</text>
    <text class="header" x="576" y="592">Environment</text>
    <line class="divider" x1="576" y1="608" x2="889" y2="608"/>
    <text class="field" x="576" y="635">api: ConexAPI · runID: int</text>
    <text class="field" x="576" y="659">challengeID · runStatus</text>
    <line class="divider" x1="576" y1="675" x2="889" y2="675"/>
    <text class="method" x="576" y="704">getInstance · startChallenge</text>
    <text class="method" x="576" y="730">checkStatus · closeRun</text>
    <text class="small" x="576" y="758">Singleton y ciclo común de la ejecución</text>
  </g>
  <g>
    <rect class="card card-teal" x="1015" y="565" width="385" height="275"/>
    <text class="stereo" x="1041" y="595">GRID · ENTORNO CONCRETO</text>
    <text class="header" x="1041" y="627">EnvironmentGrid</text>
    <line class="divider" x1="1041" y1="643" x2="1374" y2="643"/>
    <text class="field" x="1041" y="670">posición · objetivo · energía</text>
    <text class="field" x="1041" y="694">mapa: lista de CellType</text>
    <text class="field" x="1041" y="718">bumpers: lista de CellType</text>
    <line class="divider" x1="1041" y1="734" x2="1374" y2="734"/>
    <text class="method" x="1041" y="763">getPos · getBumpers · getTargetPos</text>
    <text class="method" x="1041" y="789">getEnergyLeft · move · toString</text>
    <text class="small" x="1041" y="819">Lee sensores y ejecuta movimientos</text>
  </g>

  <!-- API and response model -->
  <g>
    <rect class="card card-amber" x="550" y="820" width="350" height="180"/>
    <text class="stereo" x="576" y="850">INTEGRACIÓN HTTP</text>
    <text class="header" x="576" y="882">ConexAPI</text>
    <line class="divider" x1="576" y1="898" x2="874" y2="898"/>
    <text class="method" x="576" y="926">getStatus · getSensor</text>
    <text class="method" x="576" y="951">executeAction · closeChallenge</text>
    <text class="small" x="576" y="978">Gestiona peticiones a DBA Lab</text>
  </g>
  <g>
    <rect class="card card-amber" x="1015" y="865" width="350" height="165"/>
    <text class="stereo" x="1041" y="895">MODELO DE RESPUESTA</text>
    <text class="header" x="1041" y="927">ResponseLAB</text>
    <line class="divider" x1="1041" y1="943" x2="1339" y2="943"/>
    <text class="field" x="1041" y="971">runId · runStatus · isAlive</text>
    <text class="field" x="1041" y="997">sensorId · value · actionStatus</text>
    <text class="small" x="1041" y="1020">update(jsonResponse)</text>
  </g>
  <g>
    <rect class="card card-violet" x="1490" y="825" width="350" height="195"/>
    <text class="stereo" x="1516" y="855">PAQUETE common</text>
    <text class="header" x="1516" y="887">Tipos compartidos</text>
    <line class="divider" x1="1516" y1="903" x2="1814" y2="903"/>
    <text class="field" x="1516" y="931">Pair&lt;T,U&gt; · coordenadas y valores</text>
    <text class="field" x="1516" y="957">CellType · estado de las casillas</text>
    <text class="field" x="1516" y="983">Direction · movimiento</text>
    <text class="field" x="1516" y="1009">RunStatus · ciclo de la ejecución</text>
  </g>

  <text class="small" x="90" y="1054">Flecha azul: herencia · flecha continua: asociación/llamada · flecha discontinua: dependencia · JADE y Swing son librerías externas</text>
</svg>
